# stdout/stderr use journald (rotate via journald.conf SystemMaxUse).
# copytruncate is required: append-mode open descriptors do not reopen on reload.
/home/khaled/Khaled/runtime/*/journal/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su khaled khaled
}
